[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-quant-core"
version = "0.16.0"
description = "Fail-closed deterministic core for the personal crypto quant system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.25,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypto_quant = ["schemas/*.json"]
