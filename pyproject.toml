[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-quant-core"
version = "0.75.0"
description = "Fail-closed deterministic core for the personal crypto quant system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jsonschema>=4.25,<5",
]

[project.scripts]
system-paper-evaluation = "crypto_quant.system_paper_evaluation_cli:main"
crypto-quant-operations-dashboard = "crypto_quant.operations_dashboard:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crypto_quant = [
  "schemas/*.json",
  "dashboard/*.html",
  "dashboard/*.js",
  "dashboard/*.css",
]
