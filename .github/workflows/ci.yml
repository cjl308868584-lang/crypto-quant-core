name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Configure Asia/Shanghai runtime timezone
        run: |
          sudo ln -snf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo Asia/Shanghai | sudo tee /etc/timezone >/dev/null
          test "$(readlink /etc/localtime)" = "/usr/share/zoneinfo/Asia/Shanghai"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install fixed Python build tools
        run: >-
          python -m pip install --upgrade
          pip
          setuptools==82.0.0
          wheel==0.47.0
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: make validate
      - name: Configure fixed owner UID for security-boundary tests
        run: |
          ! getent passwd 501
          ! getent group 501
          sudo groupadd --gid 501 cryptoquant-ci
          sudo useradd --uid 501 --gid 501 --no-create-home --shell /usr/sbin/nologin cryptoquant-ci
          sudo install -d -o 501 -g 501 -m 700 /tmp/cryptoquant-ci-home
          sudo chown -R 501:501 "$GITHUB_WORKSPACE"
      - name: Run tests as fixed owner UID 501
        run: >-
          sudo -u '#501' env
          HOME=/tmp/cryptoquant-ci-home
          PATH="$PATH"
          make test
