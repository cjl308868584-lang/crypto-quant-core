[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-quant-nautilus-sandbox"
version = "0.1.0"
description = "Offline one-shot NautilusTrader compatibility sandbox"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nautilus_trader==1.227.0",
]

[project.scripts]
crypto-quant-nautilus-sandbox = "crypto_quant_nautilus_sandbox.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
